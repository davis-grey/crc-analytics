name: Validate CRC Analytics
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate match records and check generated data
        run: python scripts/validate_data.py
      - name: Cricket/data validation regression tests
        run: python -m unittest discover -s tests -v
      - name: Browser logic regression tests
        run: node tests/test_app.cjs
      - name: MVP v2 independent audit and formula tests
        run: node tests/test_mvp_v2.cjs
      - name: JavaScript parse checks
        run: |
          node --check app.js
          node --check stats.js

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare isolated browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/crc-browser" --no-package-lock playwright@1.56.1
          node "$RUNNER_TEMP/crc-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Render mobile and desktop regression checks
        run: node tests/test_mobile.cjs
        env:
          CRC_PLAYWRIGHT_MODULE: ${{ runner.temp }}/crc-browser/node_modules/playwright
          CRC_SCREENSHOTS: ${{ runner.temp }}/crc-mobile-screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mvp-v2-mobile-review
          path: ${{ runner.temp }}/crc-mobile-screenshots
          if-no-files-found: warn
